name: Pipeline SIB Cartera Desglose

on:
  workflow_dispatch:
    inputs:
      periodo_inicial:
        description: "Mes inicial YYYY-MM (def 2021-01)"
        required: false
        default: ""
      periodo_final:
        description: "Mes final YYYY-MM (def mes actual)"
        required: false
        default: ""
      tipos:
        description: "Tipos de entidad coma-sep (def AAyP)"
        required: false
        default: "AAyP"
      solo:
        description: "cartera | captacion | both"
        required: false
        default: "both"
      salida:
        description: "Ruta del snapshot de salida"
        required: false
        default: "data/sib_cartera_desglose_snapshot.json"

permissions:
  contents: write

jobs:
  sib-cartera-desglose:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar desglose de cartera y captacion
        env:
          SIB_SUBSCRIPTION_KEY: ${{ secrets.SIB_SUBSCRIPTION_KEY }}
          SIB_DESGLOSE_SNAPSHOT_PATH: ${{ github.event.inputs.salida || 'data/sib_cartera_desglose_snapshot.json' }}
          SIB_PERIODO_INICIAL: ${{ github.event.inputs.periodo_inicial }}
          SIB_PERIODO_FINAL: ${{ github.event.inputs.periodo_final }}
          SIB_TIPOS: ${{ github.event.inputs.tipos }}
          SIB_DESGLOSE_SOLO: ${{ github.event.inputs.solo }}
        run: python scripts/fetch_sib_cartera_desglose.py

      # Ver scripts/commit_generated.sh: push sin rebase, con reintentos.
      - name: Commit del snapshot si cambio
        env:
          SALIDA: ${{ github.event.inputs.salida || 'data/sib_cartera_desglose_snapshot.json' }}
        run: bash scripts/commit_generated.sh "Actualizar snapshot SIB cartera desglose [skip ci]" "$SALIDA"
