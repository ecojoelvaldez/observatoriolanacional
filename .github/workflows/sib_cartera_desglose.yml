name: Pipeline SIB Cartera Desglose

on:
  workflow_dispatch:
    inputs:
      periodos:
        description: "Cortes YYYY-MM coma-sep (prioridad sobre el rango), o 'auto'. Vacío = usar rango."
        required: false
        default: "2021-12,2022-12,2023-12,2024-12,2025-12,2026-01,2026-02,2026-03,2026-04,2026-05"
      periodo_inicial:
        description: "Mes inicial YYYY-MM (solo si 'periodos' está vacío)"
        required: false
        default: ""
      periodo_final:
        description: "Mes final YYYY-MM (solo si 'periodos' está vacío)"
        required: false
        default: ""
      tipos:
        description: "Tipos de entidad coma-sep (def AAyP)"
        required: false
        default: "AAyP"
      solo:
        description: "cartera | captacion | both"
        required: false
        default: "both"
      extra_dims:
        description: "Dimensiones extra de cartera coma-sep (ej: facilidad,tipoCliente)"
        required: false
        default: ""
      salida:
        description: "Ruta del snapshot de salida"
        required: false
        default: "data/sib_cartera_desglose_snapshot.json"

permissions:
  contents: write

jobs:
  sib-cartera-desglose:
    runs-on: ubuntu-latest
    # El granular de bancos multiples (BM) es pesado; con 120 min el job se
    # cancelaba a mitad de descarga (~2h). Se alinea con el pipeline principal.
    timeout-minutes: 350

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar desglose de cartera y captacion
        env:
          SIB_SUBSCRIPTION_KEY: ${{ secrets.SIB_SUBSCRIPTION_KEY }}
          SIB_DESGLOSE_SNAPSHOT_PATH: ${{ github.event.inputs.salida || 'data/sib_cartera_desglose_snapshot.json' }}
          SIB_PERIODOS: ${{ github.event.inputs.periodos }}
          SIB_PERIODO_INICIAL: ${{ github.event.inputs.periodo_inicial }}
          SIB_PERIODO_FINAL: ${{ github.event.inputs.periodo_final }}
          SIB_TIPOS: ${{ github.event.inputs.tipos }}
          SIB_DESGLOSE_SOLO: ${{ github.event.inputs.solo }}
          SIB_EXTRA_DIMS: ${{ github.event.inputs.extra_dims }}
        run: python scripts/fetch_sib_cartera_desglose.py

      - name: Commit del snapshot si cambio
        env:
          SALIDA: ${{ github.event.inputs.salida || 'data/sib_cartera_desglose_snapshot.json' }}
        run: |
          if [ -n "$(git status --porcelain "$SALIDA")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$SALIDA"
            git commit -m "Actualizar snapshot SIB cartera desglose [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "Sin cambios en el snapshot de desglose."
          fi
