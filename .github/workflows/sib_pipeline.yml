name: Pipeline SIB Indicadores

on:
  schedule:
    # Dia 5 y 20 de cada mes, 7:00 AM Santo Domingo (11:00 UTC).
    # La SIB publica con rezago; estas fechas capturan el dato nuevo.
    - cron: "0 11 5,20 * *"
  workflow_dispatch:
    inputs:
      diagnostico:
        description: "Imprimir campos crudos del API (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  sib-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar indicadores y generar snapshot
        env:
          SIB_SUBSCRIPTION_KEY: ${{ secrets.SIB_SUBSCRIPTION_KEY }}
          SIB_SNAPSHOT_PATH: data/sib_snapshot.json
        run: |
          if [ "${{ github.event.inputs.diagnostico }}" = "true" ]; then
            python scripts/fetch_sib_indicadores.py --diagnostico
          else
            python scripts/fetch_sib_indicadores.py
          fi

      - name: Commit del snapshot si cambio
        run: |
          if [ -n "$(git status --porcelain data/sib_snapshot.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/sib_snapshot.json
            git commit -m "Actualizar snapshot SIB indicadores [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
            echo "snapshot_actualizado=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin cambios en el snapshot SIB."
          fi
