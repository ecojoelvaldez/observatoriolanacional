name: Pipeline SIB Indicadores

on:
  schedule:
    # Dia 5 y 20 de cada mes, 7:00 AM Santo Domingo (11:00 UTC).
    # La SIB publica con rezago; estas fechas capturan el dato nuevo.
    - cron: "0 11 5,20 * *"
  workflow_dispatch:
    inputs:
      diagnostico:
        description: "Imprimir campos crudos del API (true/false)"
        required: false
        default: "false"
      periodo_inicial:
        description: "Mes inicial YYYY-MM para historia completa (vacio = ventana movil)"
        required: false
        default: ""
      periodo_final:
        description: "Mes final YYYY-MM (vacio = mes actual). Solo aplica con periodo_inicial"
        required: false
        default: ""
      salida:
        description: "Ruta del snapshot de salida"
        required: false
        default: "data/sib_snapshot.json"
      tipos:
        description: "Tipos de entidad separados por coma (vacio = BM,AAyP,BAyC)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sib-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar indicadores y generar snapshot
        env:
          SIB_SUBSCRIPTION_KEY: ${{ secrets.SIB_SUBSCRIPTION_KEY }}
          SIB_SNAPSHOT_PATH: ${{ github.event.inputs.salida || 'data/sib_snapshot.json' }}
          SIB_PERIODO_INICIAL: ${{ github.event.inputs.periodo_inicial }}
          SIB_PERIODO_FINAL: ${{ github.event.inputs.periodo_final }}
          SIB_TIPOS: ${{ github.event.inputs.tipos }}
        run: |
          if [ "${{ github.event.inputs.diagnostico }}" = "true" ]; then
            python scripts/fetch_sib_indicadores.py --diagnostico
          else
            python scripts/fetch_sib_indicadores.py
          fi

      # Antes del commit para que la linea base viaje en el mismo push; el paso
      # final convierte el fallo en run rojo sin impedir que se publique lo que
      # si llego.
      - name: Verificar frescura de los datos
        id: frescura
        continue-on-error: true
        run: python scripts/verificar_frescura.py --solo indicadores

      - name: Commit del snapshot si cambio
        env:
          SALIDA: ${{ github.event.inputs.salida || 'data/sib_snapshot.json' }}
        run: |
          if [ -n "$(git status --porcelain "$SALIDA" data/_frescura_baseline.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$SALIDA" data/_frescura_baseline.json
            git commit -m "Actualizar snapshot SIB indicadores [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
            echo "snapshot_actualizado=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sin cambios en el snapshot SIB."
          fi

      - name: Fallar si el corte quedo atras
        if: ${{ steps.frescura.outcome == 'failure' }}
        run: |
          echo "::error::El corte de indicadores quedo atras. Ver el detalle en el paso 'Verificar frescura de los datos'."
          exit 1
