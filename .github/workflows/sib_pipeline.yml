name: Pipeline SIB Indicadores

on:
  schedule:
    # Dia 5 y 20 de cada mes, 7:00 AM Santo Domingo (11:00 UTC).
    # La SIB publica con rezago; estas fechas capturan el dato nuevo.
    - cron: "0 11 5,20 * *"
  workflow_dispatch:
    inputs:
      diagnostico:
        description: "Imprimir campos crudos del API (true/false)"
        required: false
        default: "false"
      periodo_inicial:
        description: "Mes inicial YYYY-MM para historia completa (vacio = ventana movil)"
        required: false
        default: ""
      periodo_final:
        description: "Mes final YYYY-MM (vacio = mes actual). Solo aplica con periodo_inicial"
        required: false
        default: ""
      salida:
        description: "Ruta del snapshot de salida"
        required: false
        default: "data/sib_snapshot.json"
      tipos:
        description: "Tipos de entidad separados por coma (vacio = BM,AAyP,BAyC)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sib-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar indicadores y generar snapshot
        env:
          SIB_SUBSCRIPTION_KEY: ${{ secrets.SIB_SUBSCRIPTION_KEY }}
          SIB_SNAPSHOT_PATH: ${{ github.event.inputs.salida || 'data/sib_snapshot.json' }}
          SIB_PERIODO_INICIAL: ${{ github.event.inputs.periodo_inicial }}
          SIB_PERIODO_FINAL: ${{ github.event.inputs.periodo_final }}
          SIB_TIPOS: ${{ github.event.inputs.tipos }}
        run: |
          if [ "${{ github.event.inputs.diagnostico }}" = "true" ]; then
            python scripts/fetch_sib_indicadores.py --diagnostico
          else
            python scripts/fetch_sib_indicadores.py
          fi

      # Ver scripts/commit_generated.sh: push sin rebase, con reintentos.
      - name: Commit del snapshot si cambio
        id: commit-snapshot
        env:
          SALIDA: ${{ github.event.inputs.salida || 'data/sib_snapshot.json' }}
        # El script deja pushed=true|false en los outputs del paso; antes esta
        # línea escribía siempre "true" y además el paso no tenía id, así que
        # el valor no se podía leer desde ninguna parte.
        run: bash scripts/commit_generated.sh "Actualizar snapshot SIB indicadores [skip ci]" "$SALIDA"
