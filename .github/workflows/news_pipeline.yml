name: Pipeline de Noticias

on:
  schedule:
    # 6:30 AM Santo Domingo, lunes a viernes
    - cron: "30 10 * * 1-5"
    # 12:30 PM Santo Domingo, lunes a viernes
    - cron: "30 16 * * 1-5"
  workflow_dispatch:
    inputs:
      debug:
        description: "Modo verbose (true/false)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  news-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/news_pipeline.py
