name: Pipeline SIB Cartera de Creditos

on:
  schedule:
    # Dia 5 y 20 de cada mes, 7:30 AM Santo Domingo (11:30 UTC).
    # 30 min despues del pipeline de indicadores para no competir por el
    # push a main (ambos commitean snapshots al mismo branch).
    - cron: "30 11 5,20 * *"
  workflow_dispatch:
    inputs:
      diagnostico:
        description: "Sondear endpoints carteras/* con la key real (true/false)"
        required: false
        default: "false"
      ventana_meses:
        description: "Meses hacia atras a descargar (ventana movil)"
        required: false
        default: ""
      salida:
        description: "Ruta del snapshot de salida"
        required: false
        default: "data/sib_cartera_snapshot.json"
      probe_endpoints:
        description: "Endpoints extra a sondear en diagnostico (coma-separados)"
        required: false
        default: ""
      desglose:
        description: "Correr el desglose granular (cartera+captacion) (true/false)"
        required: false
        default: "false"
      periodo_inicial:
        description: "Desglose: mes inicial YYYY-MM (def 2021-01)"
        required: false
        default: ""
      periodo_final:
        description: "Desglose: mes final YYYY-MM (def mes actual)"
        required: false
        default: ""
      periodos:
        description: "Desglose: lista de cortes YYYY-MM coma-sep (prioridad sobre el rango)"
        required: false
        default: ""
      tipos:
        description: "Desglose: tipos de entidad coma-sep (def AAyP)"
        required: false
        default: "AAyP"
      solo:
        description: "Desglose: cartera | captacion | both"
        required: false
        default: "both"

permissions:
  contents: write

jobs:
  sib-cartera-pipeline:
    runs-on: ubuntu-latest
    # El desglose granular (carteras/creditos) sobre varios tipos de entidad
    # supera holgadamente los 30 min originales; con 30 el job se cancelaba a
    # mitad de descarga.
    timeout-minutes: 350

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar cartera de creditos y generar snapshot
        env:
          SIB_SUBSCRIPTION_KEY: ${{ secrets.SIB_SUBSCRIPTION_KEY }}
          SIB_CARTERA_SNAPSHOT_PATH: ${{ github.event.inputs.salida || 'data/sib_cartera_snapshot.json' }}
          SIB_CARTERA_MESES: ${{ github.event.inputs.ventana_meses }}
          SIB_PROBE_ENDPOINTS: ${{ github.event.inputs.probe_endpoints }}
          SIB_DESGLOSE_SNAPSHOT_PATH: ${{ github.event.inputs.salida || 'data/sib_cartera_snapshot.json' }}
          SIB_PERIODO_INICIAL: ${{ github.event.inputs.periodo_inicial }}
          SIB_PERIODO_FINAL: ${{ github.event.inputs.periodo_final }}
          SIB_PERIODOS: ${{ github.event.inputs.periodos }}
          SIB_TIPOS: ${{ github.event.inputs.tipos }}
          SIB_DESGLOSE_SOLO: ${{ github.event.inputs.solo }}
        run: |
          if [ "${{ github.event.inputs.desglose }}" = "true" ]; then
            python scripts/fetch_sib_cartera_desglose.py
          elif [ "${{ github.event.inputs.diagnostico }}" = "true" ]; then
            python scripts/fetch_sib_cartera.py --diagnostico
          else
            python scripts/fetch_sib_cartera.py
          fi

      - name: Commit del snapshot si cambio
        env:
          SALIDA: ${{ github.event.inputs.salida || 'data/sib_cartera_snapshot.json' }}
        run: |
          if [ -n "$(git status --porcelain "$SALIDA")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$SALIDA"
            git commit -m "Actualizar snapshot SIB cartera de creditos [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "Sin cambios en el snapshot de cartera SIB."
          fi
