name: Pipeline de Noticias v3 Static Candidates

on:
  schedule:
    # 6:30 AM Santo Domingo, lunes a viernes
    - cron: "30 10 * * 1-5"
    # 12:30 PM Santo Domingo, lunes a viernes
    - cron: "30 16 * * 1-5"
  workflow_dispatch:
    inputs:
      debug:
        description: "Modo verbose (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  news-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pipeline y generar JSON estático
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          NEWS_CANDIDATES_PATH: news_candidates.json
          MAX_TOTAL_PROPOSALS: "30"
        run: python scripts/news_pipeline.py

      # El commit va por scripts/commit_generated.sh: sincroniza con el
      # remoto y reescribe el JSON generado encima, en vez de rebasar. El
      # rebase moría con "could not apply ... Actualizar candidatos de
      # noticias" cada vez que otra corrida tocaba el mismo archivo.
      - name: Commit de candidatos si cambiaron
        run: bash scripts/commit_generated.sh "Actualizar candidatos de noticias [skip ci]" news_candidates.json
